apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-voting-app
  labels:
    app: voting-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
