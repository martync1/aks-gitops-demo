apiVersion: v1
kind: Service
metadata:
  name: my-release-mysql
  namespace: default
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: default
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "VotingAppPass123!"
            - name: MYSQL_DATABASE
              value: "voting_db"
          ports:
            - containerPort: 3306
              name: mysql
